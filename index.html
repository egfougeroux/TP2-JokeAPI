<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP - JokeAPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    
    <!-- Carte du formulaire -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h3 card-title mb-4">Générateur de blagues</h1>
        
        <form id="joke-form">
          <!-- Choix : Any ou Custom -->
          <div class="mb-3">
            <label class="form-label fw-bold d-block">Sélectionner la catégorie :</label>
            
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="categoryType" id="cat-any" value="Any" checked>
              <label class="form-check-label" for="cat-any">Any</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="categoryType" id="cat-custom" value="Custom">
              <label class="form-check-label" for="cat-custom">Custom :</label>
            </div>
          </div>

          <!-- Cases à cocher pour le mode Custom -->
          <div class="mb-3 p-3 bg-white border rounded">
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-prog" value="Programming" disabled>
              <label class="form-check-label" for="cat-prog">Programming</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-misc" value="Misc" disabled>
              <label class="form-check-label" for="cat-misc">Misc</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-dark" value="Dark" disabled>
              <label class="form-check-label" for="cat-dark">Dark</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-pun" value="Pun" disabled>
              <label class="form-check-label" for="cat-pun">Pun</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-spooky" value="Spooky" disabled>
              <label class="form-check-label" for="cat-spooky">Spooky</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input custom-cat" type="checkbox" id="cat-xmas" value="Christmas" disabled>
              <label class="form-check-label" for="cat-xmas">Christmas</label>
            </div>
          </div>

          <!-- Boutons d'action -->
          <div class="mb-2">
            <button type="submit" class="btn btn-primary">Nouvelle blague</button>
            <button type="button" id="clear-all" class="btn btn-outline-danger">Vider le tableau</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tableau des résultats -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th scope="col" style="width: 20%;">Catégorie</th>
                <th scope="col" style="width: 65%;">Blague</th>
                <th scope="col" style="width: 15%;">Édition</th>
              </tr>
            </thead>
            <tbody id="jokes-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
